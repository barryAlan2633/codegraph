[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codegraph"
version = "0.1.0"
description = "Codebase knowledge graph tool — parses source code into a Neo4j graph"
requires-python = ">=3.12"
dependencies = [
    "tree-sitter>=0.22",
    "tree-sitter-python",
    "tree-sitter-javascript",
    "tree-sitter-typescript",
    "tree-sitter-rust",
    "neo4j>=5.0",
    "mcp>=1.0",
    "click>=8.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "thefuzz>=0.22",
]

[project.scripts]
codegraph = "codegraph.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["codegraph"]
